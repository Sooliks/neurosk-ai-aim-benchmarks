<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">NeuroSK Research</title>
  <desc id="desc">Dark technical banner for NeuroSK Research and Benchmarks</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020508"/>
      <stop offset="0.5" stop-color="#050b10"/>
      <stop offset="1" stop-color="#010304"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#67e8f9" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="420" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1438" height="418" rx="29" fill="none" stroke="#a5f3fc" stroke-opacity="0.16"/>
  <rect x="1" y="1" width="1438" height="418" rx="29" fill="url(#grid)"/>
  <rect x="118" y="73" width="8" height="8" rx="4" fill="#67e8f9" filter="url(#glow)"/>
  <text x="145" y="83" fill="#a5f3fc" fill-opacity="0.72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="4">NEUROSK / RESEARCH</text>
  <text x="116" y="186" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="58">Technical reference data.</text>
  <text x="116" y="252" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="58">Reproducible benchmarks.</text>
  <text x="118" y="310" fill="#cbd5e1" fill-opacity="0.66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.2">10 MOUSE OUTPUT METHODS  /  WINDOWS 10–11  /  GPU &amp; LATENCY METHODOLOGY</text>
  <rect x="116" y="353" width="1208" height="1" fill="url(#rail)"/>
  <g transform="translate(1190 64)">
    <rect width="134" height="42" rx="13" fill="#02070a" stroke="#67e8f9" stroke-opacity="0.24"/>
    <text x="67" y="27" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">DATA / CITE</text>
  </g>
</svg>
